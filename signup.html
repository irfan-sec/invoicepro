<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/signup.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">


</head>

<body>
    <section>
        <div class="left">
            <div class="mainleft">
                <div class="one">
                    <img src="./assets/logo.png" alt="">
                    <h1>Invoice Pro</h1>

                </div>
                <div class="two">
                    <h1 style="font-size: 2.5rem;">Create Your Account</h1>
                    <p>sing up to start managing your <br> invoice and grow your <br> business</p>
                </div>
                <img src="./assets/2a337787bba410497bf6aa6a924e591034d43bbe.png" width="80%">
            </div>
        </div>
        <div class="right">

            <div class="mainright">
                <div class="innerright">
                    <div class="signup">
                        <h1>Sign Up</h1>
                        <p>create your account to get started</p>

                    </div>
                    <div class="email">
                        <h3>Email Address</h3>
                        <input type="email" placeholder="Enter Email" name="" id="">
                    </div>
                    <div class="password">
                        <h3>Password</h3>
                        <input type="password"  placeholder="Enter Password" id="">
                    </div>
                    <div class="confirm">
                        <h3>Confirm Password</h3>
                        <input type="password" placeholder="Confirm Password" name="" id="">
                    </div>
                    <div class="agree">
                        <input type="checkbox" name="" id="">
                        <p>I Agree to the <span style="color: orange;">terms an conditions</span></p>
                    </div>
                    <div class="create"><button>Create Account</button></div>
                    <p>or create with</p>
                    <div class="buttons">
                    <button>Google</button>
                    <button>Facebook</button>
                    </div>
                    <div class="account">
                        <h3>Already have an account?<span><a href="./login.html" style="text-decoration: none;color: orange;">Sign in</a></span></h3>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
